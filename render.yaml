# Render Blueprint — one-click deploy of the Football Data Platform.
#
# Creates: managed PostgreSQL + Key Value (Redis-compatible) + one Docker web
# service running ROLE=all (API + worker + scheduler + website in a single
# container). The website proxies /api/v1 to the internal API and passes client
# API keys through, so one public URL serves the site, the admin dashboard
# (/admin/api-keys) and the REST API (/api/v1).
#
# Deploy: push this repo to GitHub → render.com → New → Blueprint → pick the
# repo. Secrets marked `sync: false` are entered in the dashboard at creation.
# Plans can be adjusted in the dashboard (defaults are fine to start).

databases:
  - name: football-db
    databaseName: football
    # plan: basic-256mb      # pick a plan at creation if prompted

services:
  - type: keyvalue
    name: football-redis
    ipAllowList: []            # private network only — never expose Redis
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: football-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: ROLE
        value: all
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: football-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: football-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true     # 256-bit generated by Render
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false             # YOU enter this at Blueprint creation
      - key: API_FOOTBALL_KEY
        sync: false             # YOU enter this — or leave empty for mock mode
      - key: SITE_API_KEY
        sync: false             # optional: a stable pf_live_… key for the site

name: Public check

# Secrets-free external verification: hits the public endpoints of the
# production VPS from a GitHub runner and commits the results to
# .deploy/logs/ (readable via git fetch). No credentials involved.
on:
  push:
    branches: [arena/01a0d445-football-database]
    paths: ['.deploy/CHECK']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check public endpoints
        run: |
          { echo "public check at $(date -u +%FT%TZ)"
            for p in / /admin/api-keys /api/v1/docs /api/v1/health /api/v1/health/data; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -m 25 "http://158.178.196.221$p")
              echo "GET $p -> $code"
            done
            echo "--- /api/v1/health body:"
            curl -s -m 25 http://158.178.196.221/api/v1/health | head -c 400
            echo
            echo "--- /api/v1/health/data body:"
            curl -s -m 25 http://158.178.196.221/api/v1/health/data | head -c 600
            echo
            echo "--- /api/v1/fixtures (anonymous via website proxy; total must be > 0):"
            curl -s -m 25 "http://158.178.196.221/api/v1/fixtures?per_page=1" | head -c 400
            echo
            echo "--- provider quota (/api/v1/health/provider):"
            curl -s -m 25 http://158.178.196.221/api/v1/health/provider | head -c 500
            echo
            echo "--- frontend markers:"
            curl -s -m 25 http://158.178.196.221/ | grep -o -m1 'hero-kicker\|fixture-toggle' | head -1
          } | tee /tmp/check.txt

      - name: Publish result to the repo
        run: |
          git config user.name "check-bot"
          git config user.email "check-bot@users.noreply.github.com"
          mkdir -p .deploy/logs
          cp /tmp/check.txt ".deploy/logs/check-$(date -u +%Y%m%dT%H%M%S).txt"
          git add .deploy/logs
          git commit -m "public check result (bot)" || echo "nothing to commit"
          git push

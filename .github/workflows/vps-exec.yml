name: VPS exec

# Remote control channel: runs the bash command contained in .deploy/command
# on the production VPS (in /opt/football-platform). Used for data bootstrap,
# monitoring and ops. Triggered by a push that touches .deploy/command.
on:
  push:
    branches: [arena/01a0d445-football-database]
    paths: ['.deploy/command']

concurrency:
  group: vps-exec
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  exec:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VPS_HOST: 158.178.196.221
      VPS_USER: ubuntu
      APP_DIR: /opt/football-platform
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SSH key from one-time drop
        run: |
          BASE=$(tr -d '[:space:]' < .deploy/DEPLOY)
          curl -fsSL --retry 3 --retry-delay 2 "$BASE/vps_key" -o ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run command on the VPS
        env:
          CMD: ${{ hashFiles('.deploy/command') }}
        run: |
          true
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "cd $APP_DIR && $(cat .deploy/command)"

name: VPS exec

# Remote control channel: runs a bash command on the production VPS
# (default) or on the Actions runner (target=runner, e.g. to test the
# public URL from outside). Used for data bootstrap, monitoring and ops.
on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Bash command (runs in /opt/football-platform on the VPS)'
        required: true
      target:
        description: 'Where to run it'
        required: false
        default: vps
        type: choice
        options: [vps, runner]

concurrency:
  group: vps-exec
  cancel-in-progress: false

jobs:
  exec:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VPS_HOST: 158.178.196.221
      VPS_USER: ubuntu
      APP_DIR: /opt/football-platform
    steps:
      - name: Install SSH key
        if: inputs.target == 'vps'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run command on the VPS
        if: inputs.target == 'vps'
        env:
          CMD: ${{ inputs.command }}
        run: |
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "cd $APP_DIR && \$CMD"

      - name: Run command on the runner
        if: inputs.target == 'runner'
        env:
          CMD: ${{ inputs.command }}
        run: |
          bash -c "$CMD"

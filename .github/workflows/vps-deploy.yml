name: VPS deploy

# Deploys the platform to the production VPS over SSH.
# Triggered by a push that touches .deploy/DEPLOY (which contains the
# one-time credential-drop URL). The drop serves the SSH key + production
# .env from an unguessable, HTTPS, session-scoped endpoint and is deleted
# after use. No secrets live in the repo.
on:
  push:
    branches: [arena/01a0d445-football-database]
    paths: ['.deploy/DEPLOY']

concurrency:
  group: vps-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VPS_HOST: 158.178.196.221
      VPS_USER: ubuntu
      APP_DIR: /opt/football-platform
    steps:
      - uses: actions/checkout@v4

      - name: Fetch credentials from one-time drop
        run: |
          BASE=$(tr -d '[:space:]' < .deploy/DEPLOY)
          echo "credential drop: $BASE"
          curl -fsSL --retry 3 --retry-delay 2 "$BASE/vps_key" -o ~/.ssh/vps_key
          curl -fsSL --retry 3 --retry-delay 2 "$BASE/env" -o /tmp/prod.env
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "credentials fetched (ssh key + production env)"

      - name: Transfer code
        run: |
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "mkdir -p $APP_DIR"
          tar -cf - --exclude=.git --exclude=.deploy . | ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "tar -xf - -C $APP_DIR"
          echo "code transferred"

      - name: Write production .env (server-side only)
        run: |
          cat /tmp/prod.env | ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "cat > $APP_DIR/.env && chmod 600 $APP_DIR/.env"
          rm -f /tmp/prod.env
          echo ".env written on server (mode 600)"

      - name: Deploy (docker install, build, start, migrate, health-wait)
        run: |
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "cd $APP_DIR && bash scripts/deploy/vps-deploy.sh"

      - name: Verify from the VPS (doctor: Postgres / Redis / API-Football)
        run: |
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "cd $APP_DIR && bash scripts/deploy/vps-verify.sh" || true

      - name: Verify from the public internet
        run: |
          echo "--- public checks (http://$VPS_HOST/) ---"
          for p in / /admin/api-keys /api/v1/docs /api/v1/health /api/v1/health/data; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "http://$VPS_HOST$p")
            echo "GET $p -> $code"
          done

name: Connectivity probe

# Probes whether a GitHub runner can reach the sandbox's one-time credential
# drop, and reports the result back to the repo (readable via git fetch).
# Triggered by a push that touches .deploy/PROBE.
on:
  push:
    branches: [arena/01a0d445-football-database]
    paths: ['.deploy/PROBE']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Probe endpoints
        run: |
          {
            echo "probe at $(date -u +%FT%TZ) from $(hostname)"
            BASE=$(tr -d '[:space:]' < .deploy/DEPLOY)
            echo "--- DNS (drop host):"
            getent hosts "${BASE#https://}" | head -2 || echo "DNS FAIL"
            echo "--- control: https://example.com"
            curl -sS -o /dev/null -w 'HTTP %{http_code}\n' -m 15 https://example.com || echo "CONTROL FAIL"
            echo "--- drop: \$BASE/vps_key"
            curl -sS -o /dev/null -w 'HTTP %{http_code}\n' -m 20 "$BASE/vps_key" || echo "DROP FAIL"
            echo "--- drop verbose tail:"
            curl -sSv -m 20 "$BASE/env" -o /dev/null 2>&1 | tail -6
          } | tee /tmp/probe.txt

      - name: Report result via commit
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          cp /tmp/probe.txt ".deploy/probe-result-$(date -u +%Y%m%dT%H%M%S).txt"
          git add .deploy/probe-result-*.txt
          git commit -m "connectivity probe result (bot)" || echo "nothing to commit"
          git push
